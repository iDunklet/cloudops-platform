
AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudOps Platform - AWS Infrastructure"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod


Resources:
  TasksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "CloudOpsTasks-${Environment}"
      BillingMode: INVALID_MODE
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
Outputs:
  TasksTableName:
    Description: "Name of the CloudOps DynamoDB table"
    Value: !Ref TasksTable
